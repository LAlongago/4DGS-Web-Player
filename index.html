<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>4DGS 网页播放器</title>
    <style>
      :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #f7f9fc; background: #07090d; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; min-height: 100vh; }
      main { width: min(1280px, 100%); margin: 0 auto; padding: 24px; }
      header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 18px; }
      h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.4rem); letter-spacing: -.04em; }
      p { margin: 6px 0 0; color: #aeb7c6; }
      code { color: #72e1ff; }
      four-dgs-player { height: min(74vh, 760px); border: 1px solid #26303f; border-radius: 18px; box-shadow: 0 24px 80px rgba(0,0,0,.45); }
      .hint { margin-top: 14px; font-size: 13px; }
      @media (max-width: 640px) { main { padding: 10px; } header { display: block; } four-dgs-player { height: 70vh; border-radius: 12px; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>4DGS 网页播放器</h1>
          <p>以自由视角播放动态 Gaussian Splat 帧序列。</p>
        </div>
        <p><code>?scene=/path/to/manifest.json</code></p>
      </header>
      <four-dgs-player id="player" controls autoplay loop></four-dgs-player>
      <p class="hint">WASD / 单指 / 左键：环绕 · 右键 / 双指：平移 · Q/E / 滚轮 / 双指捏合：缩放 · 空格：播放或暂停</p>
    </main>
    <script type="module">
      import './src/index.ts';
      const scene = new URLSearchParams(location.search).get('scene');
      const player = document.querySelector('#player');
      if (scene) {
        player.setAttribute('src', scene);
      } else {
        player.shadowRoot.querySelector('.status').textContent = '请通过 ?scene=/path/to/manifest.json 指定场景清单';
        player.shadowRoot.querySelector('.status').dataset.busy = 'false';
        player.shadowRoot.querySelector('.status').hidden = false;
      }
    </script>
  </body>
</html>
